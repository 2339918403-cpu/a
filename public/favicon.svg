<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c0392b"/>
    </linearGradient>
    <linearGradient id="innerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f39c12"/>
      <stop offset="100%" stop-color="#f1c40f"/>
    </linearGradient>
  </defs>
  
  <!-- 盾牌外轮廓 -->
  <path d="M32 4 L56 14 L56 34 Q56 52 32 60 Q8 52 8 34 L8 14 Z" 
        fill="url(#shieldGrad)" stroke="#2c3e50" stroke-width="3" stroke-linejoin="round"/>
  
  <!-- 盾牌内层 -->
  <path d="M32 12 L48 19 L48 34 Q48 46 32 53 Q16 46 16 34 L16 19 Z" 
        fill="url(#innerGrad)" stroke="#2c3e50" stroke-width="2" stroke-linejoin="round"/>
  
  <!-- 60 数字 -->
  <text x="32" y="34" text-anchor="middle" font-family="'Arial Black', 'Impact', sans-serif" 
        font-size="18" font-weight="900" fill="#2c3e50" stroke="#fff" stroke-width="1.5" 
        paint-order="stroke" dominant-baseline="middle">60</text>
  
  <!-- 闪电小装饰 -->
  <path d="M44 24 L48 20 L46 26 L50 22" fill="none" stroke="#fff" stroke-width="2.5" 
        stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- 小眼睛（Q萌） -->
  <circle cx="24" cy="40" r="2.5" fill="#2c3e50"/>
  <circle cx="40" cy="40" r="2.5" fill="#2c3e50"/>
  <circle cx="24.5" cy="39" r="0.8" fill="#fff"/>
  <circle cx="40.5" cy="39" r="0.8" fill="#fff"/>
</svg>